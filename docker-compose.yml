services:
  mysql:
    image: mysql:8.0
    container_name: reinacraft-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: reinacraft_root
      MYSQL_DATABASE: reinacraft
      MYSQL_USER: reinacraft
      MYSQL_PASSWORD: reinacraft_dev_pw
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-preinacraft_root"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    container_name: reinacraft-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql_data:
  redis_data:
